name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk british-english-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: british-english-coach-apk
          path: british-english-coach.apk

      - name: Publish as the latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest british-english-coach.apk \
            --title "British English Coach (latest build)" \
            --notes "Built from ${GITHUB_SHA}. Download british-english-coach.apk on your phone and open it to install."
